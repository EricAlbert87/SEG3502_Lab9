
<section class="panneau">
  <h1>Administration — Ajouter un livre</h1>
  <p>Seuls les administrateurs peuvent ajouter des livres.</p>
  @if (message) { <p [class.succes]="succes" [class.erreur]="!succes" role="status">{{ message }}</p> }
  <form [formGroup]="bookForm" (ngSubmit)="onSubmit()">
    <label for="category">Catégorie</label>
    <select id="category" formControlName="category">
      <option value="">Choisir une catégorie</option>
      <option value="Kids">Jeunesse</option>
      <option value="Tech">Technologie</option>
      <option value="Cook">Cuisine</option>
    </select>
    <label for="title">Titre</label>
    <input id="title" formControlName="title">
    <label for="cost">Prix ($)</label>
    <input id="cost" type="text" inputmode="decimal" placeholder="19.99" formControlName="cost">
    <label for="year">Année de publication</label>
    <input id="year" type="text" inputmode="numeric" placeholder="2026" formControlName="year">
    <label for="description">Description</label>
    <textarea id="description" rows="4" formControlName="description"></textarea>
    <h2>Auteurs</h2>
    <div formArrayName="authors">
      @for (author of authors.controls; track $index) {
        <div class="auteur" [formGroupName]="$index">
          <input formControlName="firstName" aria-label="Prénom de l'auteur" placeholder="Prénom">
          <input formControlName="lastName" aria-label="Nom de l'auteur" placeholder="Nom">
          <button type="button" class="secondaire" (click)="removeAuthor($index)">Retirer</button>
        </div>
      }
    </div>
    <button type="button" class="secondaire" (click)="addAuthor()">Ajouter un auteur</button>
    <button type="submit" [disabled]="bookForm.invalid || enCours">
      {{ enCours ? 'Enregistrement...' : 'Enregistrer le livre' }}
    </button>
  </form>
</section>
