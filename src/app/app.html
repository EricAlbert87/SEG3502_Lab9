
<div class="site">
  <header class="barre">
    <a routerLink="/home" class="marque">📚 Bibliothèque sécurisée</a>
    <nav aria-label="Navigation principale">
      <a routerLink="/home">Accueil</a>
      <a routerLink="/about">À propos</a>
      <a routerLink="/contact">Nous joindre</a>
      @if (isLoggedIn) {
        <a routerLink="/books">Livres</a>
        @if (isAdmin) { <a routerLink="/admin">Administration</a> }
        <button type="button" (click)="logout()">Déconnexion</button>
      } @else {
        <a routerLink="/login">Connexion</a>
        <a routerLink="/signup">Inscription</a>
      }
    </nav>
  </header>

  <main class="contenu">
    @if (isLoggedIn) {
      <p class="session">Connecté : {{ loggedUser }}</p>
    }
    <router-outlet></router-outlet>
  </main>

  <footer>SEG 3502 · Authentification et autorisation avec JWT</footer>
</div>
