
<section class="panneau">
  <h1>Rechercher un livre</h1>
  <p>Entrez l'identifiant d'un livre pour consulter ses informations.</p>
  <div class="recherche">
    <label for="book-id">Identifiant du livre</label>
    <input id="book-id" type="number" min="1" #bookQuery (keyup.enter)="submit(bookQuery.value)">
    <button type="button" (click)="submit(bookQuery.value)">Rechercher</button>
  </div>
  @if (message) { <p class="erreur" role="alert">{{ message }}</p> }
  <router-outlet></router-outlet>
</section>
